# Default values for soma-agent-hub Helm chart.
# These values are used to render the templates under templates/.

# Global settings
global:
  imagePullPolicy: IfNotPresent
  namespace: soma-agent-hub
  imageTag: "dev"
  securityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  environment: production
  observability:
    enableOtlp: true
    otlpEndpoint: "http://otel-collector.observability:4317"
  spiffe:
    enabled: true
    trustDomain: "somaagent.io"
    certDir: "/var/run/secrets/spiffe"
    socketPath: "/run/spire/sockets/agent.sock"
    socketMountPath: "/run/spire/sockets"
    hostSocketPath: "/run/spire/sockets"
  # Default resource requests/limits applied to all services unless they
  # explicitly override them in their own `resources` block.
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "250m"
      memory: "256Mi"

# Centralized port definitions. This is the single source of truth for all service ports.
ports:
  gateway-api: 10000
  orchestrator: 10001
  identity-service: 10002
  policy-engine: 10003
  memory-gateway: 10021
  slm-service: 10005
  tool-service: 10006
  analytics-service: 10007
  settings-service: 10008
  billing-service: 10009
  constitution-service: 10010
  task-capsule-repo: 10011
  jobs: 10012
  # Ensure all services have a port defined, even if disabled by default
  "self-provisioning": 10013
  "evolution-engine": 10014
  "marketplace-service": 10015
  "voice-interface": 10016
  "recall-service": 10017
  "notification-service": 10018
  "model-proxy": 10019
  "capsule-service": 10020
  "kamachiq-service": 10021
  "mao-service": 10022
  "token-estimator": 10023
  "flink-service": 10024
  "airflow-service": 10025
  opa: 8181
  pricing-service: 10026

# OPA (Open Policy Agent) configuration – used by the dedicated OPA deployment
opa:
  enabled: true
  image: "openpolicyagent/opa:latest"
  replicaCount: 1
  port: 8181
  env: []

# mTLS configuration – optional, disabled by default. When enabled a secret named
# `soma-mtls` (created by the `mtls-secret.yaml` template) will be mounted into
# each pod at /etc/mtls. The placeholder certificate/key are empty strings; in a
# real deployment you would provide real PEM data or generate them via a Helm hook.
mtls:
  # Enable mutual TLS between all SomaAgentHub pods. When true a Kubernetes Secret
  # named `soma-mtls` (created by the `mtls-secret.yaml` template) will be mounted
  # at `/etc/mtls` inside each container. The secret must contain a PEM‑encoded
  # certificate (`tls.crt`) and private key (`tls.key`).
  enabled: true
  secretName: soma-mtls
  # The values below are placeholders – they will be replaced by a generated
  # self‑signed certificate via the helper script `scripts/generate-mtls.sh`.
  tlsCrt: ""
  tlsKey: ""

# Centralized secrets configuration
secrets:
  enabled: true
  name: soma-secrets
  # In production you should set this to false and provide real secrets via a secret manager.
  generateDevSecrets: false
  identityJwt: ""
  gatewayJwt: ""
  # Billing provider secrets (leave empty in prod and create Secret manually)
  stripeSecretKey: ""
  stripeWebhookSecret: ""
  paypalClientId: ""
  paypalClientSecret: ""

# Kafka (Bitnami) configuration – KRaft mode
defaultKafka:
  enabled: true
  replicaCount: 3
  kraft:
    enabled: true
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "250m"
      memory: "256Mi"

# Service definitions – each microservice can override these defaults
services:
  jobs:
    enabled: false
  slm-service:
    enabled: false
    replicaCount: 1
    image: "somaagent/soma-slm-service"
  policy-engine:
    enabled: true
    image: "somaagent/soma-policy-engine"
  memory-gateway:
    enabled: true
  orchestrator:
    enabled: true
    image: "somaagent/soma-orchestrator"
    env:
      - name: TEMPORAL_ENABLED
        value: "false"
    serviceAccount:
      create: true
      name: orchestrator
    volcano:
      enabled: false
      defaultQueue: interactive
      sessionImage: python:3.11-slim
      sessionCpu: 500m
      sessionMemory: 512Mi
      jobTimeoutSeconds: 300
  settings-service:
    enabled: false
  task-capsule-repo:
    enabled: false
  gateway-api:
    enabled: true
    replicaCount: 1
    image: "somaagent/soma-gateway-api"
    envFromSecret: "soma-secrets"
  identity-service:
    enabled: true
    # Use the correct identity-service image
    image: "somaagent/identity-service"
    envFromSecret: "soma-secrets"
    env:
      - name: REDIS_URL
        value: "redis://redis:6379/0"
      # OIDC / OAuth2 configuration for downstream services
      - name: OIDC_ISSUER_URL
        value: "http://identity-service:{{ index $.Values.ports \"identity-service\" }}"
      - name: OIDC_JWKS_URI
        value: "http://identity-service:{{ index $.Values.ports \"identity-service\" }}/.well-known/jwks.json"
      - name: OIDC_AUDIENCE
        value: "soma-client"
  constitution-service:
    enabled: false
  analytics-service:
    enabled: false
  billing-service:
    enabled: false
    envFromSecret: "soma-secrets"
    env:
      - name: BILLING_PROVIDER
        value: "stripe"
      - name: STRIPE_SECRET_KEY_SECRET_NAME
        value: "stripe-secret" # Kubernetes Secret containing STRIPE_SECRET_KEY
      - name: STRIPE_WEBHOOK_SECRET_SECRET_NAME
        value: "stripe-webhook-secret" # Secret with STRIPE_WEBHOOK_SECRET
      - name: BILLING_STRIPE_AUTO_INVOICE
        value: "true"
      - name: PAYPAL_ENABLED
        value: "false" # Set to true when PayPal is integrated
      - name: BILLING_CURRENCY
        value: "usd"
      - name: BILLING_USAGE_AGG_INTERVAL_SECONDS
        value: "300"
  pricing-service:
    enabled: true
    image: "somaagent/pricing-service"
    env:
      - name: CLICKHOUSE_HOST
        value: "clickhouse"
      - name: CLICKHOUSE_PORT
        value: "8123"
      - name: CLICKHOUSE_USER
        value: "default"
      - name: CLICKHOUSE_PASSWORD
        value: ""
      - name: CLICKHOUSE_DATABASE
        value: "soma"
      - name: OPA_URL
        value: "http://opa:8181"
      - name: PRICING_CACHE_TTL_SECONDS
        value: "300"

# Ingress configuration (currently disabled)
ingress:
  enabled: false
  # image field retained for compatibility; not used when disabled
  image: "somaagent/gateway-api"
  # additional ingress settings can be added here

# ServiceMonitor configuration (optional)
serviceMonitors:
  enabled: true
  # By default the ServiceMonitors are created in the release namespace.
  namespace: ""
  interval: 30s

orchestrator:
  enabled: true
  image: somaagent/orchestrator:latest
  replicaCount: 1
  port: 10001
  env:
    TEMPORAL_HOST: "temporal-server:7233"
    TEMPORAL_NAMESPACE: "default"
    TEMPORAL_TASK_QUEUE: "somagent.session.workflows"
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"

identityService:
  enabled: true
  image: somaagent/identity-service:latest
  replicaCount: 1
  port: 10002
  env:
    REDIS_URL: "redis://redis:6379/0"
    OIDC_ISSUER_URL: "http://identity-service:10002"
    OIDC_JWKS_URI: "http://identity-service:10002/.well-known/jwks.json"
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"

memoryGateway:
  enabled: true
  image: somaagent/memory-gateway:latest
  replicaCount: 1
  port: 9595
  env:
    QDRANT_URL: "http://qdrant:6333"
    REDIS_URL: "redis://redis:6379/0"

qdrant:
  enabled: true
  image: qdrant/qdrant:v1.11.0
  replicaCount: 1
  port: 10005  # maps to container 6333
  persistence:
    enabled: true
    size: 5Gi

redis:
  enabled: true
  image: redis:7-alpine
  replicaCount: 1
  port: 10003  # maps to container 6379
  persistence:
    enabled: true
    size: 2Gi

# Optional Redis exporter for Prometheus metrics
redisExporter:
  enabled: true
  image: oliver006/redis_exporter:latest
  port: 9121
  redisAddr: "redis://redis:6379"

prometheus:
  enabled: true
  # Using the kube‑prometheus‑stack chart is optional; we only expose ServiceMonitors.

otelCollector:
  enabled: true
  image: otel/opentelemetry-collector:latest
  replicaCount: 1
  port: 4317
  # Minimal collector config can be supplied via a ConfigMap if needed.
