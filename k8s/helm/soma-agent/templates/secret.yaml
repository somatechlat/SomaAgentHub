{{- if and .Values.secrets.enabled .Values.secrets.generateDevSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name | default "soma-secrets" }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: {{ .Chart.Name }}
type: Opaque
stringData:
  # Note: dev secrets removed for JWT; Identity uses RS256 + JWKS. Provide other secrets as needed.
  # Billing dev secrets (test keys) – replace with real secrets in production
  STRIPE_SECRET_KEY: {{ .Values.secrets.stripeSecretKey | quote }}
  STRIPE_WEBHOOK_SECRET: {{ .Values.secrets.stripeWebhookSecret | quote }}
  PAYPAL_CLIENT_ID: {{ .Values.secrets.paypalClientId | quote }}
  PAYPAL_CLIENT_SECRET: {{ .Values.secrets.paypalClientSecret | quote }}
{{- end }}
