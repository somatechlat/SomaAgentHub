{{- /* Create ServiceMonitors when enabled. Support both legacy and current keys. */ -}}
{{- $sm := .Values.serviceMonitors | default dict -}}
{{- $enabled := (hasKey $sm "enabled") | ternary $sm.enabled false -}}
{{- if $enabled }}
{{- $namespace := $sm.namespace | default .Release.Namespace -}}
{{- $interval := $sm.interval | default "30s" -}}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: {{ $.Chart.Name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  namespaceSelector:
    matchNames:
      - {{ $.Values.global.namespace | default $.Release.Namespace }}
  endpoints:
    - port: http
      interval: {{ $interval }}
      path: /metrics
      scheme: http
      relabelings:
        - action: replace
          sourceLabels: ["__meta_kubernetes_pod_node_name"]
          targetLabel: instance
{{- end }}
{{- end }}

{{- /* Redis exporter */ -}}
{{- if and .Values.redisExporter .Values.redisExporter.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redis-exporter
  namespace: {{ $namespace }}
  labels:
    app.kubernetes.io/name: redis-exporter
    app.kubernetes.io/part-of: {{ $.Chart.Name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-exporter
  namespaceSelector:
    matchNames:
      - {{ $.Values.global.namespace | default $.Release.Namespace }}
  endpoints:
    - port: metrics
      interval: {{ $interval }}
      path: /metrics
{{- end }}
{{- end }}
