apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "soma-agent.fullname" . }}-test-memory-gateway"
  labels:
    {{- include "soma-agent.labels" . | nindent 4 }}
    helm.sh/chart: {{ .Chart.Name }}
    app.kubernetes.io/name: {{ .Chart.Name }}-test-memory-gateway
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test-success
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.6.0
      command: ["sh", "-c", "
        set -e
        echo \"Round-trip Memory Gateway remember/recall...\"
        curl -sSf -X POST -H 'Content-Type: application/json' -d '{\"key\":\"helm-test\",\"value\":{\"ok\":true}}' \
          http://{{ include "soma-agent.fullname" . }}-memory-gateway:{{ .Values.ports.memory-gateway }}/v1/remember || exit 1
        curl -sSf http://{{ include "soma-agent.fullname" . }}-memory-gateway:{{ .Values.ports.memory-gateway }}/v1/recall/helm-test | grep -q '\"ok\": true' || exit 1
      "]

