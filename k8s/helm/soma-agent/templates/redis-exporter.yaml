{{- if and .Values.redis.enabled .Values.redisExporter.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  labels:
    app.kubernetes.io/name: redis-exporter
spec:
  ports:
    - name: metrics
      port: {{ .Values.redisExporter.port | default 9121 }}
      targetPort: 9121
  selector:
    app.kubernetes.io/name: redis-exporter
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  labels:
    app.kubernetes.io/name: redis-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-exporter
    spec:
      containers:
        - name: redis-exporter
          image: {{ .Values.redisExporter.image | default "oliver006/redis_exporter:latest" }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          env:
            - name: REDIS_ADDR
              value: {{ .Values.redisExporter.redisAddr | default "redis://redis:6379" | quote }}
          ports:
            - name: metrics
              containerPort: 9121
          resources:
            {{- toYaml $.Values.global.resources | nindent 12 }}
{{- end }}

