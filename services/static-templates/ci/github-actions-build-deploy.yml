name: build-deploy-{{APP_NAME}}

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build image
        run: |
          docker build -t {{IMAGE}} .
      - name: Push image (internal registry)
        run: |
          echo "Skipping push in template; implement registry auth here"
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Configure kubectl
        run: echo "kubectl context setup placeholder"
      - name: Helm upgrade
        run: |
          echo "helm upgrade --install {{APP_NAME}} ./helm/generated-app --set image.repository={{IMAGE}} --set service.port={{SERVICE_PORT}}"
