apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "orchestrator.fullname" . }}-config
  labels:
    {{- include "orchestrator.labels" . | nindent 4 }}
data:
  config.yaml: |
    service:
      name: orchestrator-service
      version: {{ .Chart.AppVersion }}
    
    database:
      pool_size: {{ .Values.database.pool_size }}
      max_overflow: {{ .Values.database.max_overflow }}
      pool_timeout: {{ .Values.database.pool_timeout }}
      pool_recycle: {{ .Values.database.pool_recycle }}
      echo: {{ .Values.database.echo }}
    
    kafka:
      client_id: orchestrator-service
      topic_prefix: orchestration
      producer:
        linger_ms: 10
        batch_size: 16384
    
    observability:
      service_name: orchestrator-service
      service_version: {{ .Chart.AppVersion }}
      otlp_endpoint: {{ .Values.env.OTEL_EXPORTER_OTLP_ENDPOINT }}
    
    security:
      cors_origins: ["https://soma-agent-hub.com"]
      max_request_size: 100MB
      rate_limit: 1000