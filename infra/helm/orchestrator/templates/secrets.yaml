apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orchestrator.fullname" . }}-database-secret
  labels:
    {{- include "orchestrator.labels" . | nindent 4 }}
type: Opaque
stringData:
  url: {{ .Values.secrets.database.url | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orchestrator.fullname" . }}-redis-secret
  labels:
    {{- include "orchestrator.labels" . | nindent 4 }}
type: Opaque
stringData:
  url: {{ .Values.secrets.redis.url | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orchestrator.fullname" . }}-kafka-secret
  labels:
    {{- include "orchestrator.labels" . | nindent 4 }}
type: Opaque
stringData:
  bootstrap-servers: {{ .Values.secrets.kafka.bootstrap_servers | quote }}
  {{- if .Values.secrets.kafka.sasl_username }}
  username: {{ .Values.secrets.kafka.sasl_username | quote }}
  password: {{ .Values.secrets.kafka.sasl_password | quote }}
  {{- end }}