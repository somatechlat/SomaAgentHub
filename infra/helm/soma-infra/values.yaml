# Default values for soma-infra (kept tiny for dev by default)
namespace: soma-infra

kafka:
  enabled: true
  replicaCount: 1
  kraft:
    enabled: true
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: false
  fullnameOverride: kafka

redis:
  enabled: true
  architecture: standalone
  master:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
  replica:
    replicaCount: 0
  auth:
    enabled: false
  persistence:
    enabled: false
  fullnameOverride: redis

prometheus:
  enabled: false


  enabled: false

opa:
  enabled: false

vault:
  enabled: false

etcd:
  enabled: false

# ---------------------------------------------------------------
# Capsule services configuration
# ---------------------------------------------------------------
capsuleExecutor:
  image: "soma/capsule-executor:latest"
  pullPolicy: "IfNotPresent"
  port: 8000
  resources:
    limits:
      cpu: "500m"
      memory: "256Mi"
    requests:
      cpu: "250m"
      memory: "128Mi"
    # HPA settings are defined in the template.
  hpa:
    minReplicas: 1
    maxReplicas: 5
    cpuUtilization: 80

capsuleRepo:
  image: "python:3.11-slim"
  pullPolicy: "IfNotPresent"
  port: 8002
  resources:
    limits:
      cpu: "250m"
      memory: "128Mi"
    requests:
      cpu: "100m"
      memory: "64Mi"
