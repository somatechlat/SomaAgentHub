[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv","venv","build","dist","**/__pycache__/**"]

[tool.ruff.lint]
select = ["E","F","I","W","UP","PIE","T20","Q"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = ["T201", "W293"]
"scripts/**/*.py" = ["T201", "W293"]
"services/**/tests/**/*.py" = ["T201"]
"services/kamachiq-service/**/*.py" = ["T201"]
"services/llm-hub/tests/**/*.py" = ["T201"]
"services/self-provisioning/app.py" = ["W293"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
exclude = [".venv/","venv/","build/","dist/"]
