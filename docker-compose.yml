# yamllint disable rule:brackets
---
# docker-compose.yml
# CANONICAL Docker Compose file for SomaAgentHub
# All services use the 10000+ port range for consistency
# TOTAL MEMORY BUDGET: ~9.8GB (Strictly Enforced)

name: somaagenthub

services:
  # --- Core Application Services ---
  gateway-api:
    build:
      context: .
      dockerfile: services/gateway-api/Dockerfile
    container_name: somaagenthub_gateway-api
    restart: unless-stopped
    ports:
      - "${GATEWAY_API_PORT:-10000}:10000"
    environment:
      - SOMA_AGENT_HUB_REDIS_URL=redis://redis:6379/0
      - SOMA_AGENT_HUB_GATEWAY_ORCHESTRATOR_URL=http://orchestrator:8000
      - SOMA_AGENT_HUB_IDENTITY_SERVICE_URL=http://identity-service:10002
      - SOMA_AGENT_HUB_OTLP_ENDPOINT=https://otel-collector:4317
      - OTEL_EXPORTER_OTLP_ENDPOINT=https://otel-collector:4317
      - OTEL_EXPORTER_OTLP_CERTIFICATE=/etc/otel/certs/ca.pem
      - OTEL_INSECURE=false
      - WEB_CONCURRENCY=1
      - PYTHONOPTIMIZE=1
    volumes:
      - ./infra/observability/certs/ca.pem:/etc/otel/certs/ca.pem:ro
    depends_on:
      orchestrator:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 192M
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:10000/ready', timeout=3)\"" ]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - somaagenthub-network

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    container_name: somaagenthub_orchestrator
    restart: unless-stopped
    ports:
      - "${ORCHESTRATOR_PORT:-10001}:8000"
    environment:
      - SOMA_AGENT_HUB_TEMPORAL_HOST=temporal-server:7233
      - SOMA_AGENT_HUB_TEMPORAL_NAMESPACE=${TEMPORAL_NAMESPACE:-default}
      - SOMA_AGENT_HUB_TEMPORAL_TASK_QUEUE=${TEMPORAL_TASK_QUEUE:-somagent.session.workflows}
      - SOMA_AGENT_HUB_TEMPORAL_ENABLED=${TEMPORAL_ENABLED:-true}
      - SOMA_AGENT_HUB_DATABASE_URL=postgresql+asyncpg://${APP_POSTGRES_USER:-somaagent}:${APP_POSTGRES_PASSWORD:-somaagent}@app-postgres:5432/${APP_POSTGRES_DB:-somaagent}
      - SOMA_AGENT_HUB_CAPSULE_REPO_URL=http://capsule-repo:8002/v1/capsules
      - SOMA_AGENT_HUB_OTLP_ENDPOINT=https://otel-collector:4317
      - OTEL_EXPORTER_OTLP_ENDPOINT=https://otel-collector:4317
      - OTEL_EXPORTER_OTLP_CERTIFICATE=/etc/otel/certs/ca.pem
      - OTEL_INSECURE=false
      - KAFKA_BOOTSTRAP_SERVERS=
      - WEB_CONCURRENCY=2
      - PYTHONOPTIMIZE=1
    volumes:
      - ./infra/observability/certs/ca.pem:/etc/otel/certs/ca.pem:ro
    deploy:
      resources:
        limits:
          memory: 384M
    depends_on:
      temporal-server:
        condition: service_healthy
      temporal-postgres:
        condition: service_healthy
      app-postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)\"" ]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6
    networks:
      - somaagenthub-network

  worker:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    container_name: somaagenthub_worker
    command: [ "python", "-m", "services.orchestrator.temporal_worker" ]
    restart: unless-stopped
    environment:
      - SOMA_AGENT_HUB_TEMPORAL_HOST=temporal-server:7233
      - SOMA_AGENT_HUB_TEMPORAL_NAMESPACE=${TEMPORAL_NAMESPACE:-default}
      - SOMA_AGENT_HUB_TEMPORAL_TASK_QUEUE=${TEMPORAL_TASK_QUEUE:-somagent.session.workflows}
      - SOMA_AGENT_HUB_DATABASE_URL=postgresql+asyncpg://${APP_POSTGRES_USER:-somaagent}:${APP_POSTGRES_PASSWORD:-somaagent}@app-postgres:5432/${APP_POSTGRES_DB:-somaagent}
      - SOMA_AGENT_HUB_OTLP_ENDPOINT=https://otel-collector:4317
      - OTEL_EXPORTER_OTLP_ENDPOINT=https://otel-collector:4317
      - OTEL_EXPORTER_OTLP_CERTIFICATE=/etc/otel/certs/ca.pem
      - OTEL_INSECURE=false
      - PYTHONOPTIMIZE=1
    depends_on:
      orchestrator:
        condition: service_healthy
      temporal-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M
    volumes:
      - ./infra/observability/certs/ca.pem:/etc/otel/certs/ca.pem:ro
    networks:
      - somaagenthub-network

  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    container_name: somaagenthub_identity-service
    restart: unless-stopped
    ports:
      - "${IDENTITY_SERVICE_PORT:-10002}:10002"
    environment:
      - SOMA_AGENT_HUB_REDIS_URL=redis://redis:6379/0
      - SOMA_AGENT_HUB_OIDC_ISSUER_URL=http://identity-service:10002
      - SOMA_AGENT_HUB_OIDC_JWKS_URI=http://identity-service:10002/.well-known/jwks.json
      - SOMA_AGENT_HUB_OTLP_ENDPOINT=https://otel-collector:4317
      - OTEL_EXPORTER_OTLP_ENDPOINT=https://otel-collector:4317
      - OTEL_EXPORTER_OTLP_CERTIFICATE=/etc/otel/certs/ca.pem
      - OTEL_INSECURE=false
      - WEB_CONCURRENCY=1
      - PYTHONOPTIMIZE=1
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 192M
    volumes:
      - ./infra/observability/certs/ca.pem:/etc/otel/certs/ca.pem:ro
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:10002/health', timeout=3)\"" ]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - somaagenthub-network

  # --- Optional / Micro Services ---
  policy-engine:
    build:
      context: .
      dockerfile: services/policy-engine/Dockerfile
    container_name: somaagenthub_policy-engine
    restart: unless-stopped
    ports:
      - "${POLICY_ENGINE_PORT:-10020}:10020"
    environment:
      - SOMA_AGENT_HUB_OTLP_ENDPOINT=https://otel-collector:4317
      - OTEL_EXPORTER_OTLP_ENDPOINT=https://otel-collector:4317
      - OTEL_EXPORTER_OTLP_CERTIFICATE=/etc/otel/certs/ca.pem
      - OTEL_INSECURE=false
      - SOMA_AGENT_HUB_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-}
      - WEB_CONCURRENCY=1
      - PYTHONOPTIMIZE=1
    deploy:
      resources:
        limits:
          memory: 192M
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:10020/health', timeout=3)\"" ]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./infra/observability/certs/ca.pem:/etc/otel/certs/ca.pem:ro
    networks:
      - somaagenthub-network

  constitution-service:
    build:
      context: .
      dockerfile: services/constitution-service/Dockerfile
    container_name: somaagenthub_constitution-service
    restart: unless-stopped
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "10024", "--workers", "1" ]
    ports:
      - "${CONSTITUTION_SERVICE_PORT:-10024}:10024"
    environment:
      - WEB_CONCURRENCY=1
      - PYTHONOPTIMIZE=1
    deploy:
      resources:
        limits:
          memory: 192M
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:10024/health', timeout=3)\"" ]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - somaagenthub-network

  memory-gateway:
    build:
      context: .
      dockerfile: services/memory-gateway/Dockerfile
    container_name: somaagenthub_memory-gateway
    restart: unless-stopped
    ports:
      - "${MEMORY_GATEWAY_PORT:-10021}:8000"
    environment:
      - SOMA_AGENT_HUB_OTLP_ENDPOINT=https://otel-collector:4317
      - OTEL_EXPORTER_OTLP_ENDPOINT=https://otel-collector:4317
      - OTEL_EXPORTER_OTLP_CERTIFICATE=/etc/otel/certs/ca.pem
      - OTEL_INSECURE=false
      - WEB_CONCURRENCY=1
      - PYTHONOPTIMIZE=1
    deploy:
      resources:
        limits:
          memory: 192M
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\"" ]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./infra/observability/certs/ca.pem:/etc/otel/certs/ca.pem:ro
    networks:
      - somaagenthub-network

  tool-service:
    build:
      context: .
      dockerfile: services/tool-service/Dockerfile
    container_name: somaagenthub_tool-service
    restart: unless-stopped
    ports:
      - "${TOOL_SERVICE_PORT:-10028}:8000"
    environment:
      - SOMA_AGENT_HUB_OTLP_ENDPOINT=https://otel-collector:4317
      - OTEL_EXPORTER_OTLP_ENDPOINT=https://otel-collector:4317
      - OTEL_EXPORTER_OTLP_CERTIFICATE=/etc/otel/certs/ca.pem
      - OTEL_INSECURE=false
      - WEB_CONCURRENCY=1
      - PYTHONOPTIMIZE=1
    deploy:
      resources:
        limits:
          memory: 192M
    volumes:
      - ./infra/observability/certs/ca.pem:/etc/otel/certs/ca.pem:ro
    networks:
      - somaagenthub-network

  capsule-repo:
    build:
      context: .
      dockerfile: services/task_capsule_repo/Dockerfile
    container_name: somaagenthub_capsule-repo
    restart: unless-stopped
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8002", "--workers", "1" ]
    ports:
      - "${CAPSULE_REPO_PORT:-10023}:8002"
    environment:
      - SOMA_AGENT_HUB_DATABASE_URL=postgresql+asyncpg://${APP_POSTGRES_USER:-somaagent}:${APP_POSTGRES_PASSWORD:-somaagent}@app-postgres:5432/${APP_POSTGRES_DB:-somaagent}
      - WEB_CONCURRENCY=1
      - PYTHONOPTIMIZE=1
    deploy:
      resources:
        limits:
          memory: 192M
    depends_on:
      app-postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3)\"" ]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - somaagenthub-network

  pricing-service:
    build:
      context: .
      dockerfile: services/pricing-service/Dockerfile
    container_name: somaagenthub_pricing-service
    restart: unless-stopped
    ports:
      - "${PRICING_SERVICE_PORT:-10026}:10026"
    environment:
      - SOMA_AGENT_HUB_CLICKHOUSE_HOST=clickhouse
      - SOMA_AGENT_HUB_CLICKHOUSE_HTTP_PORT=8123
      - SOMA_AGENT_HUB_CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - SOMA_AGENT_HUB_CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
      - SOMA_AGENT_HUB_OTLP_ENDPOINT=https://otel-collector:4317
      - OTEL_EXPORTER_OTLP_ENDPOINT=https://otel-collector:4317
      - OTEL_EXPORTER_OTLP_CERTIFICATE=/etc/otel/certs/ca.pem
      - OTEL_INSECURE=false
      - WEB_CONCURRENCY=1
      - PYTHONOPTIMIZE=1
    deploy:
      resources:
        limits:
          memory: 256M  # Reduced from plan default (covered in misc)
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./infra/observability/certs/ca.pem:/etc/otel/certs/ca.pem:ro
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:10026/health', timeout=3)\"" ]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - somaagenthub-network

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: somaagenthub_notification-service
    restart: unless-stopped
    environment:
      - SOMA_AGENT_HUB_NOTIFICATION_USE_KAFKA=false
      - SOMA_AGENT_HUB_OTLP_ENDPOINT=https://otel-collector:4317
      - OTEL_EXPORTER_OTLP_ENDPOINT=https://otel-collector:4317
      - OTEL_EXPORTER_OTLP_CERTIFICATE=/etc/otel/certs/ca.pem
      - OTEL_INSECURE=false
      - WEB_CONCURRENCY=1
      - PYTHONOPTIMIZE=1
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-10027}:10026"
    deploy:
      resources:
        limits:
          memory: 192M
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:10026/health', timeout=3)\"" ]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - somaagenthub-network
    volumes:
      - ./infra/observability/certs/ca.pem:/etc/otel/certs/ca.pem:ro

  # --- Infrastructure Services ---
  app-postgres:
    image: postgres:16.4-alpine
    container_name: somaagenthub_app-postgres
    restart: unless-stopped
    ports:
      - "${APP_POSTGRES_PORT:-10004}:5432"
    # Tune shared_buffers to 25% of 512MB RAM
    command: [ "postgres", "-c", "shared_buffers=128MB", "-c", "effective_cache_size=300MB" ]
    environment:
      - POSTGRES_USER=${APP_POSTGRES_USER:-somaagent}
      - POSTGRES_PASSWORD=${APP_POSTGRES_PASSWORD:-somaagent}
      - POSTGRES_DB=${APP_POSTGRES_DB:-somaagent}
    volumes:
      - app-postgres-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${APP_POSTGRES_USER:-somaagent} -d ${APP_POSTGRES_DB:-somaagent}" ]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - somaagenthub-network

  temporal-postgres:
    image: postgres:15-alpine
    container_name: somaagenthub_temporal-postgres
    restart: unless-stopped
    # Tune shared_buffers to 25% of 256MB RAM
    command: [ "postgres", "-c", "shared_buffers=64MB", "-c", "effective_cache_size=150MB" ]
    environment:
      - POSTGRES_USER=${TEMPORAL_POSTGRES_USER:-temporal}
      - POSTGRES_PASSWORD=${TEMPORAL_POSTGRES_PASSWORD:-temporal}
      - POSTGRES_DB=${TEMPORAL_POSTGRES_DB:-temporal}
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${TEMPORAL_POSTGRES_USER:-temporal} -d ${TEMPORAL_POSTGRES_DB:-temporal}" ]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - somaagenthub-network

  temporal-server:
    image: temporalio/auto-setup:1.22.4
    container_name: somaagenthub_temporal
    restart: unless-stopped
    ports:
      - "7233:7233"
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_SEEDS=temporal-postgres
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_DB=temporal
    depends_on:
      temporal-postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "bash -lc 'IP=$(hostname -i | awk \"{print $1}\"); echo > /dev/tcp/$${IP}/7233'" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - somaagenthub-network

  redis:
    image: redis:7-alpine
    container_name: somaagenthub_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-10003}:6379"
    # Tune maxmemory to fit in 256MB with overhead
    command: [ "redis-server", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no" ]
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - somaagenthub-network

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: somaagenthub_qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-10005}:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 768M
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://127.0.0.1:6333/healthz || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 6
    networks:
      - somaagenthub-network

  clickhouse:
    image: clickhouse/clickhouse-server:24.7-alpine
    container_name: somaagenthub_clickhouse
    restart: unless-stopped
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-10006}:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    deploy:
      resources:
        limits:
          memory: 768M
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 6
    networks:
      - somaagenthub-network

  minio:
    image: minio/minio:latest
    container_name: somaagenthub_minio
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-somaagent}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-local-developer}
    command: server /data --console-address :9001
    ports:
      - "${MINIO_API_PORT:-10007}:9000"
      - "${MINIO_CONSOLE_PORT:-10008}:9001"
    volumes:
      - minio-data:/data
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://127.0.0.1:9000/minio/health/live || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 6
    networks:
      - somaagenthub-network

  # --- Observability Infrastructure ---
  prometheus:
    image: prom/prometheus:latest
    container_name: somaagenthub_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=200h"
      - "--web.enable-lifecycle"
    ports:
      - "${PROMETHEUS_PORT:-10010}:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy | grep -q Healthy || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - somaagenthub-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: somaagenthub_otel_collector
    restart: unless-stopped
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    ports:
      - "${OTEL_COLLECTOR_OTLP_PORT:-10015}:4317"  # OTLP gRPC
      - "${OTEL_COLLECTOR_OTLP_HTTP_PORT:-10016}:4318"  # OTLP HTTP
    volumes:
      - ./infra/observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
      - ./infra/observability/certs/otel-collector.pem:/etc/otel/certs/otel-collector.pem:ro
      - ./infra/observability/certs/otel-collector.key:/etc/otel/certs/otel-collector.key:ro
      - ./infra/observability/certs/ca.pem:/etc/otel/certs/ca.pem:ro
    deploy:
      resources:
        limits:
          memory: 192M
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:4318 || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 6
    networks:
      - somaagenthub-network

  tempo:
    image: grafana/tempo:2.5.0
    container_name: somaagenthub_tempo
    restart: unless-stopped
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./infra/observability/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "${TEMPO_HTTP_PORT:-10012}:3200"
      - "${TEMPO_OTLP_GRPC_PORT:-10014}:4317"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:3200/metrics || exit 1" ]
    networks:
      - somaagenthub-network

  loki:
    image: grafana/loki:2.9.6
    container_name: somaagenthub_loki
    restart: unless-stopped
    command: [ "-config.file=/etc/loki/local-config.yaml" ]
    ports:
      - "${LOKI_HTTP_PORT:-10018}:3100"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready || exit 1" ]
    networks:
      - somaagenthub-network

  grafana:
    image: grafana/grafana:10.4.1
    container_name: somaagenthub_grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-10030}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - somaagenthub-network

volumes:
  temporal-postgres-data:
    driver: local
    name: somaagenthub_temporal_postgres_data
  redis-data:
    driver: local
