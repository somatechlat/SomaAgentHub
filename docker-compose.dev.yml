version: '3.8'

services:
  # Core Database Services
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: soma
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  clickhouse:
    image: clickhouse/clickhouse-server:23-alpine
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: soma
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: default
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Core Services
  gateway-api:
    build:
      context: .
      dockerfile: services/gateway-api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SOMASTACK_ENVIRONMENT=DEV
      - SOMASTACK_DEPLOYMENT_MODE=DEV
      - SOMASTACK_SERVICE_NAME=gateway-api
      - SOMASTACK_REDIS_URL=redis://redis:6379
      - SOMASTACK_DATABASE_URL=postgresql://postgres:postgres@postgres:5432/soma
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - SOMASTACK_ENVIRONMENT=DEV
      - SOMASTACK_DEPLOYMENT_MODE=DEV
      - SOMASTACK_SERVICE_NAME=orchestrator
      - SOMASTACK_REDIS_URL=redis://redis:6379
      - SOMASTACK_DATABASE_URL=postgresql://postgres:postgres@postgres:5432/soma
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  memory-gateway:
    build:
      context: .
      dockerfile: services/memory-gateway/Dockerfile
    ports:
      - "8082:8082"
    environment:
      - SOMASTACK_ENVIRONMENT=DEV
      - SOMASTACK_DEPLOYMENT_MODE=DEV
      - SOMASTACK_SERVICE_NAME=memory-gateway
      - SOMASTACK_REDIS_URL=redis://redis:6379
      - SOMASTACK_DATABASE_URL=postgresql://postgres:postgres@postgres:5432/soma
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  policy-engine:
    build:
      context: .
      dockerfile: services/policy-engine/Dockerfile
    ports:
      - "8083:8083"
    environment:
      - SOMASTACK_ENVIRONMENT=DEV
      - SOMASTACK_DEPLOYMENT_MODE=DEV
      - SOMASTACK_SERVICE_NAME=policy-engine
      - SOMASTACK_REDIS_URL=redis://redis:6379
      - SOMASTACK_DATABASE_URL=postgresql://postgres:postgres@postgres:5432/soma
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  llm-hub:
    build:
      context: .
      dockerfile: services/llm-hub/Dockerfile
    ports:
      - "8084:8084"
    environment:
      - SOMASTACK_ENVIRONMENT=DEV
      - SOMASTACK_DEPLOYMENT_MODE=DEV
      - SOMASTACK_SERVICE_NAME=llm-hub
      - SOMASTACK_REDIS_URL=redis://redis:6379
      - SOMASTACK_DATABASE_URL=postgresql://postgres:postgres@postgres:5432/soma
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  pricing-service:
    build:
      context: .
      dockerfile: services/pricing-service/Dockerfile
    ports:
      - "8085:8085"
    environment:
      - SOMASTACK_ENVIRONMENT=DEV
      - SOMASTACK_DEPLOYMENT_MODE=DEV
      - SOMASTACK_SERVICE_NAME=pricing-service
      - SOMASTACK_REDIS_URL=redis://redis:6379
      - SOMASTACK_DATABASE_URL=postgresql://postgres:postgres@postgres:5432/soma
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # Monitoring
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
  grafana_data: