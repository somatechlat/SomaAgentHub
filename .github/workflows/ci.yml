name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13']
    env:
      RELEASE_NAME: soma-ci-${{ github.run_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # Install core development dependencies (linters, test framework, etc.)
      - name: Install core development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Install any service‑specific requirements (policy‑engine, memory‑gateway, …)
      - name: Install service‑specific dependencies
        run: |
          for svc in services/policy-engine services/memory-gateway services/gateway-api services/orchestrator services/identity-service; do
            if [ -f "$svc/requirements.txt" ]; then
              pip install -r "$svc/requirements.txt"
            fi
          done

      # Lint Python code with ruff
      - name: Lint Python (ruff)
        run: |
          pip install ruff
          ruff check .

      # Type checking with mypy (non‑blocking)
      - name: Type check (mypy)
        run: |
          pip install mypy
          mypy services || true

      # Helm lint
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.12.0
      - name: Lint Helm chart
        run: helm lint ./k8s/helm/soma-agent

      # Spin up a KinD cluster so helm install/tests can run in CI
      - name: Set up KinD cluster
        uses: helm/kind-action@v1.9.0

      # Run unit / integration tests for each service individually to avoid import path issues
      - name: Run service tests
        env:
          MEMORY_GATEWAY_PORT: 10021
          POLICY_ENGINE_PORT: 10020
          # Use the repository root for imports of the top‑level ``app`` namespace package.
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "Running tests for each service..."
          for svc in services/*; do
            if [ -d "$svc/tests" ]; then
              echo "\n=== Testing $svc ==="
              # Run tests with the repo root on PYTHONPATH so `from app.main import app` works.
              (cd "$svc" && pytest -q tests)
            fi
          done

      # Tier-0 docker-compose smoke test (brings up minimal stack, runs health checks, tears down)
      - name: Smoke test Tier-0 docker-compose stack
        run: |
          chmod +x ./scripts/smoke_compose.sh
          ./scripts/smoke_compose.sh

      # Deploy the chart to a temporary release and run Helm tests
      - name: Install Helm chart (temporary release)
        run: |
          helm upgrade --install ${{ env.RELEASE_NAME }} ./k8s/helm/soma-agent --namespace default --wait --timeout 300s
      - name: Run Helm tests
        if: always()
        run: |
          helm test ${{ env.RELEASE_NAME }} --namespace default || true
      - name: Uninstall temporary release
        if: always()
        run: |
          helm uninstall ${{ env.RELEASE_NAME }} --namespace default || true

    # ---------------------------------------------------------------------
    # Capsule CI – validates capsule manifests, builds a Docker image, and
    # executes a minimal Temporal workflow to ensure end‑to‑end functionality.
    # ---------------------------------------------------------------------
    capsule-ci:
      runs-on: ubuntu-latest
      needs: ci
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.13'
            cache: 'pip'

        - name: Install development dependencies
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements-dev.txt
            pip install temporalio httpx

        - name: Run capsule CI script
          env:
            TEMPORAL_HOST: localhost:7233
          run: |
            chmod +x ./scripts/capsule_ci.sh
            ./scripts/capsule_ci.sh
