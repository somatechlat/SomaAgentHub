    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install core dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Install service-specific requirements (policy-engine, memory-gateway, etc.)
      - name: Install service dependencies
        run: |
          for svc in services/policy-engine services/memory-gateway services/gateway-api services/orchestrator services/identity-service; do
            if [ -f $svc/requirements.txt ]; then
              pip install -r $svc/requirements.txt
            fi
          done

      - name: Run tests
        env:
          # Ensure services can be imported without Docker; use in‑process FastAPI test clients
          MEMORY_GATEWAY_PORT: 10021
          POLICY_ENGINE_PORT: 10020
        run: |
          pytest -q services/*/testsname: CI

