name: Documentation Quality

on:
  push:
    branches: [ main, develop ]
    paths: [ 'docs/**' ]
  pull_request:
    branches: [ main ]
    paths: [ 'docs/**' ]
  schedule:
    # Run quarterly audit on the 1st of every 3rd month at 2 AM UTC
    - cron: '0 2 1 */3 *'

jobs:
  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2
      
      - name: Lint markdown files
        run: markdownlint-cli2 "docs/**/*.md"

  check-links:
    name: Check Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install link checker
        run: npm install -g markdown-link-check
      
      - name: Check internal links
        run: |
          find docs -name "*.md" -exec markdown-link-check {} \;

  validate-changelog:
    name: Validate Changelog
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for git tags
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Validate changelog
        run: python scripts/validate-changelog.py

  render-diagrams:
    name: Render Diagrams
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup PlantUML
        run: |
          sudo apt-get update
          sudo apt-get install -y plantuml
      
      - name: Render PlantUML diagrams
        run: |
          find docs -name "*.puml" -exec plantuml {} \;
      
      - name: Check for diagram changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Diagrams need to be re-rendered"
            git status --porcelain
            exit 1
          fi

  quarterly-audit:
    name: Quarterly Documentation Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests markdown
      
      - name: Run documentation audit
        run: python scripts/audit-docs.py
      
      - name: Upload audit report
        uses: actions/upload-artifact@v3
        with:
          name: documentation-health-report
          path: documentation-health-report.json
      
      - name: Create issue if health score is low
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            let report = {};
            try {
              report = JSON.parse(fs.readFileSync('documentation-health-report.json', 'utf8'));
            } catch (e) {
              report = { health_score: 0 };
            }
            
            if (report.health_score < 80) {
              github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `📚 Documentation Health Alert - Score: ${report.health_score}/100`,
                body: `## Documentation Health Report
            
            **Health Score:** ${report.health_score}/100 ⚠️
            **Audit Date:** ${report.audit_date}
            
            ### Issues Found:
            - **Stale Files:** ${report.stale_files?.length || 0}
            - **Broken Links:** ${report.broken_links?.length || 0}
            - **Missing Metadata:** ${report.missing_metadata?.length || 0}
            
            ### Action Required:
            The documentation health score is below 80%. Please review and address the issues identified in the audit report.
            
            **Audit Report:** Available in the workflow artifacts.
            
            ### Next Steps:
            1. Review the detailed audit report
            2. Fix broken links and update stale content
            3. Add missing metadata to documentation files
            4. Re-run the audit to verify improvements
            
            This issue was automatically created by the quarterly documentation audit.`,
                labels: ['documentation', 'maintenance', 'priority-medium']
              });
            }

  accessibility-check:
    name: Accessibility Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Check for alt text in images
        run: |
          # Check for images without alt text
          if grep -r "!\[]\(" docs/; then
            echo "Found images without alt text"
            exit 1
          fi
          echo "All images have alt text"
      
      - name: Check heading structure
        run: |
          # Check for proper heading hierarchy
          python3 -c "
          import re
          import sys
          from pathlib import Path
          
          errors = []
          for md_file in Path('docs').rglob('*.md'):
              content = md_file.read_text()
              headings = re.findall(r'^(#{1,6})', content, re.MULTILINE)
              
              if headings:
                  prev_level = 0
                  for heading in headings:
                      level = len(heading)
                      if level > prev_level + 1:
                          errors.append(f'{md_file}: Heading level jump from {prev_level} to {level}')
                      prev_level = level
          
          if errors:
              for error in errors:
                  print(error)
              sys.exit(1)
          print('Heading structure is valid')
          "

  spell-check:
    name: Spell Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install aspell
        run: sudo apt-get install -y aspell aspell-en
      
      - name: Create custom dictionary
        run: |
          cat > .aspell.en.pws << 'EOF'
          personal_ws-1.1 en 100
          SomaAgentHub
          Kubernetes
          FastAPI
          PostgreSQL
          Qdrant
          Temporal
          Redis
          ClickHouse
          MinIO
          Grafana
          Prometheus
          SPIFFE
          SPIRE
          OAuth
          JWT
          API
          CLI
          SDK
          UI
          UX
          DevOps
          SRE
          RBAC
          mTLS
          TLS
          YAML
          JSON
          HTTP
          HTTPS
          REST
          GraphQL
          WebSocket
          Docker
          Helm
          Terraform
          GitHub
          GitLab
          CI
          CD
          EOF
      
      - name: Spell check documentation
        run: |
          find docs -name "*.md" -exec aspell --personal=./.aspell.en.pws --mode=markdown check {} \;